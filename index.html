<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlayer — Flash P2P Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #121212; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header.app-header {
            height: 56px;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-title {
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .mode-toggle {
            display: flex;
            background: #101010;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 3px;
            gap: 4px;
        }
        .mode-btn {
            background: transparent;
            color: #888;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn {
            background: #222;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .refresh-btn:hover {
            background: #00ffcc;
            color: #000;
        }

        /* Main Workspace Container */
        main.app-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        #module-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #flash-module-container {
            width: 100%;
            height: 100%;
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            background: #000;
        }

        /* Global Status Footer */
        footer.app-footer {
            height: 32px;
            background: #101010;
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-family: monospace;
            font-size: 11px;
            color: #00ffcc;
        }
        .repo-badge {
            color: #666;
            font-size: 10px;
        }

        /* Generic Action Button class used across loaded modules */
        .action-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .action-btn:hover { background: #00cca3; }
        .action-btn:disabled { background: #444; color: #777; cursor: not-allowed; }

        #diagnostics-panel {
            position: fixed;
            top: 64px;
            right: 12px;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            width: min(620px, calc(100vw - 24px));
            max-height: min(65vh, 620px);
            border: 1px solid #596168;
            border-radius: 5px;
            background: rgba(12, 15, 17, 0.97);
            color: #e3e7e9;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
            font: 11px/1.4 monospace;
        }

        .diagnostics-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid #394147;
        }

        .diagnostics-header strong { color: #00ffcc; }
        #diagnostics-count { color: #aab4b9; }
        #diagnostics-error-count { color: #ff7777; font-weight: bold; }

        .diagnostics-actions { display: flex; gap: 6px; }

        .diagnostics-actions button {
            padding: 4px 7px;
            border: 1px solid #596168;
            border-radius: 3px;
            background: #202629;
            color: #e3e7e9;
            font: inherit;
            cursor: pointer;
        }

        #diagnostics-log {
            min-height: 100px;
            overflow: auto;
            padding: 6px 0;
        }

        .diagnostic-entry {
            display: grid;
            grid-template-columns: 72px 58px minmax(0, 1fr);
            gap: 7px;
            padding: 3px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .diagnostic-time { color: #818b90; }
        .diagnostic-source { color: #7ccbc0; }
        .diagnostic-entry[data-level="warn"] .diagnostic-message { color: #ffd166; }
        .diagnostic-entry[data-level="error"] .diagnostic-message { color: #ff7777; }
        .diagnostic-entry[data-level="debug"] .diagnostic-message { color: #aab4b9; }

        @media (max-width: 600px) {
            #diagnostics-panel { top: 62px; right: 6px; width: calc(100vw - 12px); max-height: 60vh; }
            .diagnostic-entry { grid-template-columns: 58px 48px minmax(0, 1fr); gap: 4px; padding-inline: 5px; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <span class="logo-title">⚡ NovaPlayer</span>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-role-host" onclick="NovaApp.selectRole('host')">🖥️ Host (Mac)</button>
            <button class="mode-btn" id="btn-role-client" onclick="NovaApp.selectRole('client')">💻 Client (Chromebook)</button>
        </div>

        <div class="header-actions">
            <button class="refresh-btn" onclick="NovaApp.refreshCurrentModule()">
                🔄 Refresh Assets from GitHub
            </button>
        </div>
    </header>

    <section id="diagnostics-panel" aria-label="Application diagnostics">
        <div class="diagnostics-header">
            <strong>Application diagnostics</strong>
            <span id="diagnostics-count">0 events</span>
            <span id="diagnostics-error-count">0 errors</span>
            <div class="diagnostics-actions">
                <button id="diagnostics-export" type="button">Export</button>
                <button id="diagnostics-clear" type="button">Clear</button>
            </div>
        </div>
        <div id="diagnostics-log" role="log" aria-live="polite"></div>
    </section>

    <main class="app-main">
        <div id="module-container">
            <!-- Dynamic module content (host.html / client.html) loaded here -->
        </div>

        <div id="flash-module-container">
            <!-- Dynamic flash container (flash.html) loaded here when active -->
        </div>
    </main>

    <footer class="app-footer">
        <span id="status-bar">Status: Initializing loader...</span>
        <span class="repo-badge" id="repo-source-badge">Repo: coolguy1239837461/NovaPlayer@main</span>
    </footer>

    <!-- Injectable Module Style Placeholders -->
    <style id="active-module-style"></style>
    <style id="flash-module-style"></style>

    <script>
        window.NovaApp = (function() {
            const GITHUB_REPO_OWNER = "coolguy1239837461";
            const GITHUB_REPO_NAME = "NovaPlayer";
            const GITHUB_BRANCH = "main";
            
            const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}`;

            let currentRole = 'host';
            const diagnosticsLog = document.getElementById('diagnostics-log');
            const diagnosticEntries = [];
            const diagnosticMethods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'table', 'assert', 'group', 'groupCollapsed', 'groupEnd', 'clear', 'count', 'countReset', 'time', 'timeEnd'];
            const originalConsoleMethods = {};
            let diagnosticFetch = null;
            let diagnosticErrorCount = 0;

            function describeValue(value) {
                if (value instanceof Error) return value.stack || `${value.name}: ${value.message}`;
                if (typeof value === 'string') return value;
                try {
                    return JSON.stringify(value);
                } catch (_) {
                    return String(value);
                }
            }

            function logDiagnostic(source, level, ...values) {
                if (!diagnosticsLog) return;
                const entry = { time: new Date().toISOString(), source, level, message: values.map(describeValue).join(' ') };
                diagnosticEntries.push(entry);
                if (level === 'error') diagnosticErrorCount++;
                document.getElementById('diagnostics-count').textContent = `${diagnosticEntries.length} events`;
                document.getElementById('diagnostics-error-count').textContent = `${diagnosticErrorCount} errors`;
                const wasAtBottom = diagnosticsLog.scrollHeight - diagnosticsLog.scrollTop - diagnosticsLog.clientHeight < 24;
                const row = document.createElement('div');
                row.className = 'diagnostic-entry';
                row.dataset.level = level;
                const time = document.createElement('span');
                time.className = 'diagnostic-time';
                time.textContent = new Date(entry.time).toLocaleTimeString();
                const sourceLabel = document.createElement('span');
                sourceLabel.className = 'diagnostic-source';
                sourceLabel.textContent = source;
                const message = document.createElement('span');
                message.className = 'diagnostic-message';
                message.textContent = entry.message;
                row.append(time, sourceLabel, message);
                diagnosticsLog.appendChild(row);
                while (diagnosticsLog.children.length > 2000) diagnosticsLog.firstElementChild.remove();
                if (wasAtBottom) diagnosticsLog.scrollTop = diagnosticsLog.scrollHeight;
            }

            function installDiagnostics() {
                diagnosticMethods.forEach((method) => {
                    if (typeof console[method] !== 'function') return;
                    originalConsoleMethods[method] = console[method].bind(console);
                    console[method] = (...values) => {
                        const level = method === 'warn' ? 'warn' : method === 'error' || method === 'assert' ? 'error' : 'info';
                        if (method !== 'assert' || values[0] === false) logDiagnostic('console', level, method, ...values);
                        originalConsoleMethods[method](...values);
                    };
                });
                window.addEventListener('error', (event) => {
                    if (event.target === window) logDiagnostic('window', 'error', event.message, event.filename, `${event.lineno}:${event.colno}`, event.error || '');
                });
                document.addEventListener('error', (event) => {
                    const target = event.target;
                    if (target !== document && target !== window) {
                        logDiagnostic('resource', 'error', target.currentSrc || target.src || target.href || target.tagName, 'failed to load');
                    }
                }, true);
                window.addEventListener('unhandledrejection', (event) => {
                    logDiagnostic('promise', 'error', 'Unhandled rejection:', event.reason);
                });
                window.addEventListener('securitypolicyviolation', (event) => {
                    logDiagnostic('security', 'error', event.violatedDirective, event.blockedURI, event.sourceFile, event.lineNumber);
                });
                diagnosticFetch = window.fetch.bind(window);
                window.fetch = async (...args) => {
                    const resource = args[0];
                    const url = typeof resource === 'string' ? resource : resource && resource.url || String(resource);
                    logDiagnostic('fetch', 'debug', 'request', url);
                    try {
                        const response = await diagnosticFetch(...args);
                        logDiagnostic('fetch', response.ok ? 'info' : 'warn', response.status, url);
                        return response;
                    } catch (error) {
                        logDiagnostic('fetch', 'error', url, error);
                        throw error;
                    }
                };
                const interactionEvents = [
                    'click', 'dblclick', 'auxclick', 'contextmenu',
                    'pointerdown', 'pointerup', 'pointercancel', 'pointerover', 'pointerout',
                    'touchstart', 'touchend', 'touchcancel', 'mousedown', 'mouseup',
                    'keydown', 'keyup', 'beforeinput', 'input', 'change', 'focusin', 'focusout',
                    'submit', 'reset', 'select', 'dragstart', 'dragenter', 'dragover', 'dragleave', 'drop', 'dragend',
                    'wheel', 'scroll', 'copy', 'cut', 'paste', 'compositionstart', 'compositionupdate', 'compositionend'
                ];
                interactionEvents.forEach((eventName) => document.addEventListener(eventName, (event) => {
                    const target = event.target;
                    const descriptor = target instanceof Element
                        ? `${target.tagName.toLowerCase()}${target.id ? `#${target.id}` : ''}${target.getAttribute('aria-label') ? `[${target.getAttribute('aria-label')}]` : ''}`
                        : String(target);
                    const details = [];
                    if (target instanceof Element && target.closest('button, label, a')) {
                        details.push(`text="${target.closest('button, label, a').textContent.trim().slice(0, 100)}"`);
                    }
                    if (event instanceof KeyboardEvent) details.push(`key=${event.key}`, `code=${event.code}`, `repeat=${event.repeat}`);
                    if (event instanceof PointerEvent) details.push(`pointer=${event.pointerType}`, `x=${Math.round(event.clientX)}`, `y=${Math.round(event.clientY)}`);
                    if (event instanceof WheelEvent) details.push(`delta=(${Math.round(event.deltaX)},${Math.round(event.deltaY)})`);
                    if (event.dataTransfer) details.push(`files=${Array.from(event.dataTransfer.files || [], (file) => file.name).join(',') || 'none'}`);
                    if (target instanceof HTMLInputElement) {
                        if (target.type === 'password') details.push('value=[redacted]');
                        else if (target.type === 'file') details.push(`files=${Array.from(target.files || [], (file) => file.name).join(',') || 'none'}`);
                        else if (target.type === 'checkbox' || target.type === 'radio') details.push(`checked=${target.checked}`);
                        else if (target.type !== 'button' && target.type !== 'submit') details.push(`value=${target.value}`);
                    } else if (target instanceof HTMLSelectElement) {
                        details.push(`value=${target.value}`);
                    }
                    logDiagnostic('interaction', 'info', event.type, descriptor, ...details);
                }, true));

                ['online', 'offline', 'resize', 'orientationchange', 'pageshow', 'pagehide'].forEach((eventName) => {
                    window.addEventListener(eventName, (event) => {
                        logDiagnostic('browser', 'info', event.type, `viewport=${window.innerWidth}x${window.innerHeight}`, `online=${navigator.onLine}`);
                    });
                });
                document.addEventListener('visibilitychange', () => {
                    logDiagnostic('browser', 'info', 'visibilitychange', document.visibilityState);
                });

                const originalXhrOpen = XMLHttpRequest.prototype.open;
                const originalXhrSend = XMLHttpRequest.prototype.send;
                XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                    this.__diagnosticRequest = { method, url: String(url) };
                    return originalXhrOpen.call(this, method, url, ...rest);
                };
                XMLHttpRequest.prototype.send = function(...args) {
                    const request = this.__diagnosticRequest || { method: 'unknown', url: 'unknown' };
                    logDiagnostic('xhr', 'debug', 'request', request.method, request.url);
                    this.addEventListener('loadend', () => logDiagnostic('xhr', this.status >= 400 ? 'warn' : 'info', 'complete', this.status, request.url), { once: true });
                    this.addEventListener('error', () => logDiagnostic('xhr', 'error', 'failed', request.url), { once: true });
                    return originalXhrSend.apply(this, args);
                };

                if ('PerformanceObserver' in window) {
                    try {
                        new PerformanceObserver((list) => list.getEntries().forEach((entry) => {
                            if (entry.entryType === 'resource') {
                                logDiagnostic('resource', 'debug', entry.initiatorType, entry.name, `${Math.round(entry.duration)}ms`, `bytes=${entry.transferSize || 0}`);
                            }
                        })).observe({ type: 'resource', buffered: true });
                    } catch (error) {
                        logDiagnostic('diagnostics', 'warn', 'Resource timing observer unavailable', error);
                    }
                }

                document.getElementById('diagnostics-export').addEventListener('click', () => {
                    const blob = new Blob([JSON.stringify(diagnosticEntries, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const anchor = document.createElement('a');
                    anchor.href = url;
                    anchor.download = `novaplayer-diagnostics-${Date.now()}.json`;
                    anchor.click();
                    URL.revokeObjectURL(url);
                    logDiagnostic('diagnostics', 'info', 'Full session log exported');
                });
                document.getElementById('diagnostics-clear').addEventListener('click', () => {
                    diagnosticsLog.replaceChildren();
                    diagnosticEntries.length = 0;
                    diagnosticErrorCount = 0;
                    document.getElementById('diagnostics-count').textContent = '0 events';
                    document.getElementById('diagnostics-error-count').textContent = '0 errors';
                    logDiagnostic('diagnostics', 'info', 'Log cleared');
                });
                logDiagnostic('diagnostics', 'info', 'Global diagnostics initialized');
            }

            installDiagnostics();

            function setStatus(msg) {
                const level = /\b(error|failed|failure|not found|could not|unable)\b/i.test(msg) ? 'error' : 'info';
                logDiagnostic('status', level, msg);
                const sb = document.getElementById("status-bar");
                if (sb) sb.innerText = "Status: " + msg;
            }

            async function fetchAsset(path, preferGitHub = false) {
                const cacheBuster = `?t=${Date.now()}`;
                const githubUrl = `${RAW_BASE_URL}/${path}${cacheBuster}`;

                if (!preferGitHub) {
                    try {
                        const localResponse = await fetch(`./${path}${cacheBuster}`);
                        if (localResponse.ok) return await localResponse.text();
                    } catch (err) {
                        console.warn(`[NovaPlayer] Could not load local ${path} (${err.message}). Trying GitHub...`);
                    }
                }

                try {
                    const response = await fetch(githubUrl);
                    if (response.ok) {
                        return await response.text();
                    }
                    throw new Error(`GitHub fetch status ${response.status}`);
                } catch (err) {
                    console.warn(`[NovaPlayer] Could not fetch ${path} from GitHub (${err.message}). Trying relative local path...`);
                    const localResponse = await fetch(`./${path}${cacheBuster}`);
                    if (!localResponse.ok) {
                        throw new Error(`Failed to load ${path} locally or from GitHub.`);
                    }
                    return await localResponse.text();
                }
            }

            async function loadModule(roleName, preferGitHub = false) {
                setStatus(`Loading '${roleName}' assets...`);
                
                try {
                    const htmlText = await fetchAsset(`${roleName}/${roleName}.html`, preferGitHub);
                    const cssText = await fetchAsset(`${roleName}/${roleName}.css`, preferGitHub);
                    const jsText = await fetchAsset(`${roleName}/${roleName}.js`, preferGitHub);

                    // Inject CSS
                    document.getElementById('active-module-style').textContent = cssText;

                    // Inject HTML
                    const container = document.getElementById('module-container');
                    container.innerHTML = htmlText;

                    // Cleanup previous module if exists
                    if (currentRole === 'host' && window.HostModule && window.HostModule.cleanup) {
                        window.HostModule.cleanup();
                    } else if (currentRole === 'client' && window.ClientModule && window.ClientModule.cleanup) {
                        window.ClientModule.cleanup();
                    }

                    // Execute JS
                    const scriptEl = document.createElement('script');
                    scriptEl.textContent = jsText;
                    document.body.appendChild(scriptEl);
                    document.body.removeChild(scriptEl);

                    // Initialize newly loaded module
                    if (roleName === 'host' && window.HostModule && window.HostModule.init) {
                        window.HostModule.init();
                    } else if (roleName === 'client' && window.ClientModule && window.ClientModule.init) {
                        window.ClientModule.init();
                    }

                    setStatus(`'${roleName.toUpperCase()}' assets loaded${preferGitHub ? ' from GitHub' : ' from this workspace'}.`);
                } catch (err) {
                    console.error(err);
                    setStatus(`Error loading module '${roleName}': ${err.message}`);
                }
            }

            async function selectRole(role) {
                currentRole = role;
                document.getElementById('btn-role-host').classList.toggle('active', role === 'host');
                document.getElementById('btn-role-client').classList.toggle('active', role === 'client');
                
                // Hide flash view if open
                const flashBox = document.getElementById('flash-module-container');
                if (flashBox) flashBox.style.display = 'none';

                await loadModule(role);
            }

            async function refreshCurrentModule() {
                setStatus(`Refreshing assets for ${currentRole} from GitHub...`);
                await loadModule(currentRole, true);
            }

            async function loadFlashView(isClient) {
                setStatus("Loading Flash Player module from GitHub repository...");
                try {
                    const htmlText = await fetchAsset('flash/flash.html');
                    const cssText = await fetchAsset('flash/flash.css');
                    const jsText = await fetchAsset('flash/flash.js');

                    document.getElementById('flash-module-style').textContent = cssText;
                    const flashBox = document.getElementById('flash-module-container');
                    flashBox.innerHTML = htmlText;
                    flashBox.dataset.role = isClient ? 'client' : 'host';
                    flashBox.style.display = 'block';

                    const scriptEl = document.createElement('script');
                    scriptEl.textContent = jsText;
                    document.body.appendChild(scriptEl);
                    document.body.removeChild(scriptEl);

                    if (window.FlashModule && window.FlashModule.init) {
                        window.FlashModule.init();
                    }
                    setStatus("Flash Player view active.");
                } catch (err) {
                    console.error(err);
                    setStatus(`Error loading Flash module: ${err.message}`);
                }
            }

            // Initial startup
            window.addEventListener('DOMContentLoaded', () => {
                selectRole('host');
            });

            return {
                selectRole: selectRole,
                refreshCurrentModule: refreshCurrentModule,
                loadFlashView: loadFlashView,
                setStatus: setStatus,
                logDiagnostic: logDiagnostic
            };
        })();
    </script>
    <!-- Load engines after diagnostics is active so their failures are captured. -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</body>
</html>
