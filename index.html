<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlayer — Flash P2P Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #121212; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header.app-header {
            height: 56px;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-title {
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .mode-toggle {
            display: flex;
            background: #101010;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 3px;
            gap: 4px;
        }
        .mode-btn {
            background: transparent;
            color: #888;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn {
            background: #222;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .refresh-btn:hover {
            background: #00ffcc;
            color: #000;
        }

        /* Main Workspace Container */
        main.app-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        #module-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #flash-module-container {
            width: 100%;
            height: 100%;
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            background: #000;
        }

        /* Global Status Footer */
        footer.app-footer {
            height: 32px;
            background: #101010;
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-family: monospace;
            font-size: 11px;
            color: #00ffcc;
        }
        .repo-badge {
            color: #666;
            font-size: 10px;
        }

        /* Generic Action Button class used across loaded modules */
        .action-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .action-btn:hover { background: #00cca3; }
        .action-btn:disabled { background: #444; color: #777; cursor: not-allowed; }
    </style>
    <!-- Ruffle Flash Engine -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <span class="logo-title">⚡ NovaPlayer</span>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-role-host" onclick="NovaApp.selectRole('host')">🖥️ Host (Mac)</button>
            <button class="mode-btn" id="btn-role-client" onclick="NovaApp.selectRole('client')">💻 Client (Chromebook)</button>
        </div>

        <div class="header-actions">
            <button class="refresh-btn" onclick="NovaApp.refreshCurrentModule()">
                🔄 Refresh Assets from GitHub
            </button>
        </div>
    </header>

    <main class="app-main">
        <div id="module-container">
            <!-- Dynamic module content (host.html / client.html) loaded here -->
        </div>

        <div id="flash-module-container">
            <!-- Dynamic flash container (flash.html) loaded here when active -->
        </div>
    </main>

    <footer class="app-footer">
        <span id="status-bar">Status: Initializing loader...</span>
        <span class="repo-badge" id="repo-source-badge">Repo: coolguy1239837461/NovaPlayer@main</span>
    </footer>

    <!-- Injectable Module Style Placeholders -->
    <style id="active-module-style"></style>
    <style id="flash-module-style"></style>

    <script>
        window.NovaApp = (function() {
            const GITHUB_REPO_OWNER = "coolguy1239837461";
            const GITHUB_REPO_NAME = "NovaPlayer";
            const GITHUB_BRANCH = "main";
            
            const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}`;

            let currentRole = 'host';

            function setStatus(msg) {
                const sb = document.getElementById("status-bar");
                if (sb) sb.innerText = "Status: " + msg;
            }

            async function fetchAsset(path, preferGitHub = false) {
                const cacheBuster = `?t=${Date.now()}`;
                const githubUrl = `${RAW_BASE_URL}/${path}${cacheBuster}`;

                if (!preferGitHub) {
                    try {
                        const localResponse = await fetch(`./${path}${cacheBuster}`);
                        if (localResponse.ok) return await localResponse.text();
                    } catch (err) {
                        console.warn(`[NovaPlayer] Could not load local ${path} (${err.message}). Trying GitHub...`);
                    }
                }

                try {
                    const response = await fetch(githubUrl);
                    if (response.ok) {
                        return await response.text();
                    }
                    throw new Error(`GitHub fetch status ${response.status}`);
                } catch (err) {
                    console.warn(`[NovaPlayer] Could not fetch ${path} from GitHub (${err.message}). Trying relative local path...`);
                    const localResponse = await fetch(`./${path}${cacheBuster}`);
                    if (!localResponse.ok) {
                        throw new Error(`Failed to load ${path} locally or from GitHub.`);
                    }
                    return await localResponse.text();
                }
            }

            async function loadModule(roleName, preferGitHub = false) {
                setStatus(`Loading '${roleName}' assets...`);
                
                try {
                    const htmlText = await fetchAsset(`${roleName}/${roleName}.html`, preferGitHub);
                    const cssText = await fetchAsset(`${roleName}/${roleName}.css`, preferGitHub);
                    const jsText = await fetchAsset(`${roleName}/${roleName}.js`, preferGitHub);

                    // Inject CSS
                    document.getElementById('active-module-style').textContent = cssText;

                    // Inject HTML
                    const container = document.getElementById('module-container');
                    container.innerHTML = htmlText;

                    // Cleanup previous module if exists
                    if (currentRole === 'host' && window.HostModule && window.HostModule.cleanup) {
                        window.HostModule.cleanup();
                    } else if (currentRole === 'client' && window.ClientModule && window.ClientModule.cleanup) {
                        window.ClientModule.cleanup();
                    }

                    // Execute JS
                    const scriptEl = document.createElement('script');
                    scriptEl.textContent = jsText;
                    document.body.appendChild(scriptEl);
                    document.body.removeChild(scriptEl);

                    // Initialize newly loaded module
                    if (roleName === 'host' && window.HostModule && window.HostModule.init) {
                        window.HostModule.init();
                    } else if (roleName === 'client' && window.ClientModule && window.ClientModule.init) {
                        window.ClientModule.init();
                    }

                    setStatus(`'${roleName.toUpperCase()}' assets loaded${preferGitHub ? ' from GitHub' : ' from this workspace'}.`);
                } catch (err) {
                    console.error(err);
                    setStatus(`Error loading module '${roleName}': ${err.message}`);
                }
            }

            async function selectRole(role) {
                currentRole = role;
                document.getElementById('btn-role-host').classList.toggle('active', role === 'host');
                document.getElementById('btn-role-client').classList.toggle('active', role === 'client');
                
                // Hide flash view if open
                const flashBox = document.getElementById('flash-module-container');
                if (flashBox) flashBox.style.display = 'none';

                await loadModule(role);
            }

            async function refreshCurrentModule() {
                setStatus(`Refreshing assets for ${currentRole} from GitHub...`);
                await loadModule(currentRole, true);
            }

            async function loadFlashView(isClient) {
                setStatus("Loading Flash Player module from GitHub repository...");
                try {
                    const htmlText = await fetchAsset('flash/flash.html');
                    const cssText = await fetchAsset('flash/flash.css');
                    const jsText = await fetchAsset('flash/flash.js');

                    document.getElementById('flash-module-style').textContent = cssText;
                    const flashBox = document.getElementById('flash-module-container');
                    flashBox.innerHTML = htmlText;
                    flashBox.dataset.role = isClient ? 'client' : 'host';
                    flashBox.style.display = 'block';

                    const scriptEl = document.createElement('script');
                    scriptEl.textContent = jsText;
                    document.body.appendChild(scriptEl);
                    document.body.removeChild(scriptEl);

                    if (window.FlashModule && window.FlashModule.init) {
                        window.FlashModule.init();
                    }
                    setStatus("Flash Player view active.");
                } catch (err) {
                    console.error(err);
                    setStatus(`Error loading Flash module: ${err.message}`);
                }
            }

            // Initial startup
            window.addEventListener('DOMContentLoaded', () => {
                selectRole('host');
            });

            return {
                selectRole: selectRole,
                refreshCurrentModule: refreshCurrentModule,
                loadFlashView: loadFlashView,
                setStatus: setStatus
            };
        })();
    </script>
</body>
</html>
