<div class="host-container" id="host-setup-card">
    <div class="panel-card">
        <h3>🖥️ Host Setup (Mac)</h3>
        <p>Select your game folder containing your main <code>.swf</code> file and assets.</p>

        <div class="form-group">
            <button class="action-btn secondary-btn" id="host-select-folder-btn">📁 Select Game Folder</button>
            <span id="selected-folder-name" class="folder-display">No folder selected</span>
        </div>

        <div class="form-group" id="swf-select-group" style="display:none;">
            <label for="swf-file-select">Select Main SWF File</label>
            <select id="swf-file-select" class="dropdown-select"></select>
        </div>

        <button class="action-btn" id="host-start-btn" disabled>Start Hosting Session</button>
    </div>
</div>

<div class="host-container" id="host-active-card" style="display:none;">
    <div class="panel-card">
        <h3>⚡ Host Live Session</h3>
        <p>Share this Room Code with the Chromebook client:</p>
        
        <div class="room-code-display" id="active-room-code">----</div>
        
        <div class="connection-status-box">
            <span class="status-indicator"></span>
            <span id="host-peer-status">Waiting for client connection...</span>
        </div>

        <button class="action-btn danger-btn" id="host-stop-btn">End Session</button>
    </div>
</div>
