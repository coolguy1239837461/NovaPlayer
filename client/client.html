<div class="client-container">
    <div class="panel-card">
        <h3>💻 Client Connection (Chromebook)</h3>
        <p>Enter the Room Code provided by the Host Mac to join the session.</p>

        <div class="form-group">
            <label for="room-code-input">Room Code</label>
            <input type="text" id="room-code-input" placeholder="e.g. K7X4-PQ92" autocomplete="off" spellcheck="false">
        </div>

        <button class="action-btn" id="client-connect-btn">Connect to Room & Wait</button>
        <label class="client-control-lock">
            <input id="client-controls-locked" type="checkbox">
            <span>Lock My Controls</span>
        </label>
    </div>
</div>
